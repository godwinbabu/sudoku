<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>v3 — Journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.r{font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.r.light{--bg:#F2F2F7;--surface:#FFFFFF;--edge:transparent;--ink:#000000;--ink2:#63636A;--line:#D4D4DA;--accent:#007580;--btnBg:#007580;--btnInk:#FFFFFF;--btnEdge:transparent;--fill:rgba(118,118,128,.14);--fillEdge:transparent;--pill:rgba(0,0,0,.07);--glass:rgba(255,255,255,.62);--glassEdge:rgba(255,255,255,.9);--glassShadow:0 10px 30px rgba(0,0,0,.14)}
.r.dark{--bg:#000000;--surface:#151517;--edge:transparent;--ink:#F2F2F7;--ink2:#A1A1AA;--line:#2C2C2E;--accent:#5AD4E6;--btnBg:#5AD4E6;--btnInk:#00262B;--btnEdge:transparent;--fill:rgba(118,118,128,.3);--fillEdge:transparent;--pill:rgba(255,255,255,.12);--glass:rgba(72,72,78,.5);--glassEdge:rgba(255,255,255,.16);--glassShadow:0 10px 30px rgba(0,0,0,.6)}
.r.night{--bg:#000000;--surface:#000000;--edge:#3A2410;--ink:#D08A3C;--ink2:#A56A2E;--line:#24160A;--accent:#D9602B;--btnBg:transparent;--btnInk:#D9602B;--btnEdge:#8A3F1C;--fill:transparent;--fillEdge:#3A2410;--pill:transparent;--glass:transparent;--glassEdge:#3A2410;--glassShadow:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glassEdge);box-shadow:var(--glassShadow)}
.disp{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;letter-spacing:-.02em}
button{font:inherit;color:inherit}
.grp{background:var(--surface);border:1px solid var(--edge);border-radius:26px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-top:1px solid var(--line);font-size:16px}
.row:first-child{border-top:0}
.row b{flex-grow:1;font-weight:600}
.row span{font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{font-size:13px;font-weight:500;color:var(--ink2);text-align:right;padding:10px 16px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 16px;text-align:right;border-top:1px solid var(--line)}
td:first-child{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;font-size:17px}
.sw{width:51px;height:31px;border-radius:16px;box-sizing:border-box;padding:2px;display:flex;flex-shrink:0;border:1.5px solid var(--fillEdge);background:var(--fill)}
.sw i{width:24px;height:24px;border-radius:12px;background:var(--ink2)}
.sw.on{background:var(--btnBg);border-color:var(--btnEdge);justify-content:flex-end}
.sw.on i{background:var(--btnInk)}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink2)}
.day i{width:22px;height:22px;border-radius:11px;box-sizing:border-box;border:2px solid var(--line)}
.day i.on{border-color:var(--accent);background:var(--accent)}
.r.night .day i.on{background:transparent;box-shadow:inset 0 0 0 4px #000,inset 0 0 0 11px var(--accent)}
h2{margin:18px 4px 8px;font-size:15px;font-weight:600;color:var(--ink2)}
</style>
</helmet>
<div class="r {{mode}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); padding: 54px 16px 0">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <span style="font-size: 15px; font-weight: 500; color: var(--ink2)">Nothing here leaves this iPhone</span>
    <button class="glass" aria-label="Night" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  </div>
  <h1 class="disp" style="margin: 4px 0 14px; font-size: 33px; line-height: 38px">Journal</h1>

  <div style="background: var(--surface); border: 1px solid var(--edge); border-radius: 26px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
    <div style="flex-shrink: 0">
      <div class="disp" style="font-size: 40px; line-height: 40px; font-variant-numeric: tabular-nums">4</div>
      <div style="font-size: 13px; font-weight: 500; color: var(--ink2)">days in a row</div>
    </div>
    <div role="img" aria-label="This week: played Wednesday to Saturday" style="flex-grow: 1; display: flex; justify-content: space-between; padding-left: 8px">
      <span class="day"><i></i>S</span><span class="day"><i></i>M</span><span class="day"><i></i>T</span><span class="day"><i class="on"></i>W</span><span class="day"><i class="on"></i>T</span><span class="day"><i class="on"></i>F</span><span class="day"><i class="on"></i>S</span>
    </div>
  </div>

  <h2>Solved</h2>
  <div class="grp">
    <table>
      <thead><tr><th scope="col">Level</th><th scope="col">Solved</th><th scope="col">Best</th><th scope="col">Typical</th></tr></thead>
      <tbody>
        <tr><td>Easy</td><td>14</td><td>3:52</td><td>5:10</td></tr>
        <tr><td>Medium</td><td>9</td><td>8:10</td><td>12:30</td></tr>
        <tr><td>Hard</td><td>2</td><td>21:35</td><td>24:00</td></tr>
        <tr><td>Expert</td><td>0</td><td>–</td><td>–</td></tr>
        <tr><td>Master</td><td>0</td><td>–</td><td>–</td></tr>
      </tbody>
    </table>
  </div>

  <h2>Assists</h2>
  <div class="grp">
    <div class="row"><b>Show mistakes</b><span>When I check</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
    <div class="row"><b>Tidy notes</b><span class="sw on" role="switch" aria-checked="true" aria-label="Tidy notes"><i></i></span></div>
    <div class="row"><b>Show timer</b><span class="sw on" role="switch" aria-checked="true" aria-label="Show timer"><i></i></span></div>
    <div class="row"><b>Cell names in hints</b><span>Row 5, column 2</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
  </div>

  <div style="position: absolute; left: 21px; right: 21px; bottom: 21px; display: flex; gap: 10px">
    <nav class="glass" aria-label="Tabs" style="flex-grow: 1; height: 62px; border-radius: 31px; padding: 4px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg>Play</button>
      <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>Learn</button>
      <button aria-current="page" style="border: 0; background: var(--pill); border-radius: 27px; color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Journal</button>
    </nav>
    <button class="glass" aria-label="Import a puzzle from a photo" style="width: 62px; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark","night"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { mode: this.props.mode ?? 'light' };
}
}
</script>
</body>
</html>
