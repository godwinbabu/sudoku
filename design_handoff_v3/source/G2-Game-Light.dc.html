<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass 2 — Game · Light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.r{font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.r.light{--bg:#F2F2F7;--surface:#FFFFFF;--edge:transparent;--ink:#000000;--ink2:#63636A;--line:#D4D4DA;--lineM:#3A3A3C;--accent:#007580;--focus:rgba(0,124,137,.10);--btnBg:#007580;--btnInk:#FFFFFF;--btnEdge:transparent;--fill:rgba(118,118,128,.14);--fillEdge:transparent;--glass:rgba(255,255,255,.62);--glassEdge:rgba(255,255,255,.9);--glassShadow:0 10px 30px rgba(0,0,0,.14)}
.r.dark{--bg:#000000;--surface:#151517;--edge:transparent;--ink:#F2F2F7;--ink2:#A1A1AA;--line:#2C2C2E;--lineM:#7C7C82;--accent:#5AD4E6;--focus:rgba(90,212,230,.13);--btnBg:#5AD4E6;--btnInk:#00262B;--btnEdge:transparent;--fill:rgba(118,118,128,.3);--fillEdge:transparent;--glass:rgba(72,72,78,.5);--glassEdge:rgba(255,255,255,.16);--glassShadow:0 10px 30px rgba(0,0,0,.6)}
.r.night{--bg:#000000;--surface:#000000;--edge:#3A2410;--ink:#D08A3C;--ink2:#A56A2E;--line:#24160A;--lineM:#80522A;--accent:#D9602B;--focus:#140A02;--btnBg:transparent;--btnInk:#D9602B;--btnEdge:#8A3F1C;--fill:transparent;--fillEdge:#3A2410;--glass:transparent;--glassEdge:#3A2410;--glassShadow:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glassEdge);box-shadow:var(--glassShadow)}
button{font:inherit;color:inherit}
.disp{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;letter-spacing:-.02em}
.c{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-size:26px;font-variant-numeric:tabular-nums;border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-sizing:border-box}
.c:nth-child(9n){border-right:0}.c:nth-child(n+73){border-bottom:0}
.c.br{border-right:2px solid var(--lineM)}.c.bb{border-bottom:2px solid var(--lineM)}
.c.g{font-weight:800;color:var(--ink)}.c.u{font-weight:500;color:var(--accent)}
.c.fx{background:var(--focus)}
.c.ev::after{content:"";position:absolute;inset:3px;border:2px solid var(--accent);border-radius:9px}
.c.tg{color:var(--accent);font-weight:800}
.c.tg::after{content:"";position:absolute;inset:3px;border:2px dashed var(--accent);border-radius:9px}
.ng{position:absolute;inset:3px 4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.ng i{font-style:normal;font-family:"DM Sans",sans-serif;font-size:10px;line-height:1;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.tool{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:500}
.key{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-size:28px;line-height:29px;font-weight:800;padding:0}
.key small{font-family:"DM Sans",sans-serif;font-size:11px;line-height:13px;color:var(--ink2);font-weight:600}
</style>
</helmet>
<div class="r {{mode}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); padding: 54px 16px 0">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <a class="glass" href="G2-Home-Light.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span class="disp" style="font-size: 21px">Medium</span>
      <span style="font-size: 15px; font-weight: 600; color: var(--ink2); font-variant-numeric: tabular-nums">12:40</span>
    </div>
    <div class="glass" style="height: 44px; border-radius: 22px; display: flex; align-items: center; padding: 0 4px; box-sizing: border-box">
      <button aria-label="Night" style="border: 0; background: transparent; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      <button aria-label="More" style="border: 0; background: transparent; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
  </div>

  <div role="img" aria-label="Sudoku board, 41 of 81 cells filled, with pencil notes. Hint target at row 5, column 2." style="margin: 8px -12px 0; background: var(--surface); border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr))">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="81"><div class="{{c.k}}">{{c.d}}<span class="ng"><sc-for list="{{c.ns}}" as="m" hint-placeholder-count="0"><i>{{m.t}}</i></sc-for></span></div></sc-for>
  </div>

  <div style="margin-top: 10px; background: var(--surface); border: 1px solid var(--edge); border-radius: 22px; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span class="disp" style="font-size: 21px; line-height: 26px">Hidden Single</span>
      <span style="font-size: 13px; font-weight: 500; color: var(--ink2)">Hint · 3 of 3</span>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 20px">Row 4, row 6 and column 1 each already hold a 5. In box 4 that leaves one cell: row 5, column 2.</p>
    <div style="display: flex; gap: 8px; margin-top: 8px">
      <button style="flex: 0 0 104px; height: 44px; border: 1px solid var(--fillEdge); border-radius: 22px; background: var(--fill); color: var(--accent); font-size: 15px; font-weight: 700">Lesson</button>
      <button style="flex: 1; height: 44px; border: 1.5px solid var(--btnEdge); border-radius: 22px; background: var(--btnBg); color: var(--btnInk); font-size: 15px; font-weight: 700">Place 5 · assisted</button>
    </div>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 28px; display: flex; flex-direction: column; gap: 8px">
    <div class="glass" style="height: 52px; border-radius: 26px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); box-sizing: border-box">
      <button class="tool"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a5.5 5.5 0 0 1 0 11h-3"/></svg>Undo</button>
      <button class="tool"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H9l-5-5a2 2 0 0 1 0-2.8l8.4-8.4a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L12 20"/></svg>Erase</button>
      <button class="tool"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/></svg>Notes off</button>
      <button class="tool" aria-pressed="true" style="color: var(--accent); font-weight: 700"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2.2h5c.1-1 .5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>Hint</button>
    </div>
    <div class="glass" style="height: 64px; border-radius: 26px; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); padding: 0 4px; box-sizing: border-box">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="9"><button class="key" aria-label="{{k.label}}">{{k.d}}<small>{{k.n}}</small></button></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark","night"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const G = '23........7..9..48...34.2....9..145........91..395.8..9..2...8.5.....6.2.42..6.79';
const U = '.....8.........3....8..5....2..6......68..7..7................................1..';
const N = { 2: '145', 3: '167', 4: '17', 6: '59', 7: '16', 9: '16', 11: '15', 12: '16', 18: '16', 25: '16', 26: '67', 40: '23', 41: '234', 50: '24', 52: '26', 55: '16', 56: '17', 58: '137', 59: '347', 64: '18', 65: '17', 66: '147', 72: '38', 76: '38' };
const EV = [34, 49, 63], T = 37;
const cells = [];
for (let i = 0; i < 81; i++) {
const r = Math.floor(i / 9), c = i % 9;
let k = 'c';
if (G[i] !== '.') k += ' g'; else if (U[i] !== '.') k += ' u';
if (c % 3 === 2 && c < 8) k += ' br';
if (r % 3 === 2 && r < 8) k += ' bb';
if (r >= 3 && r <= 5 && c <= 2) k += ' fx';
if (EV.indexOf(i) >= 0) k += ' ev';
if (i === T) k += ' tg';
const ns = [];
if (N[i]) for (let n = 1; n <= 9; n++) ns.push({ t: N[i].indexOf(String(n)) >= 0 ? String(n) : '' });
cells.push({ d: G[i] !== '.' ? G[i] : U[i] !== '.' ? U[i] : i === T ? '5' : '', ns: ns, k: k });
}
const left = [6, 3, 5, 5, 5, 5, 5, 3, 3];
const keys = left.map(function (n, i) { return { d: String(i + 1), n: String(n), label: (i + 1) + ', ' + n + ' left' }; });
return { mode: this.props.mode ?? 'light', cells: cells, keys: keys };
}
}
</script>
</body>
</html>
