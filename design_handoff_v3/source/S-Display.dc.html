<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>v3 — Display sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.r{font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.r.light{--bg:#F2F2F7;--surface:#FFFFFF;--edge:transparent;--ink:#000000;--ink2:#63636A;--line:#D4D4DA;--accent:#007580;--btnBg:#007580;--btnInk:#FFFFFF;--btnEdge:transparent;--fill:rgba(118,118,128,.14);--fillEdge:transparent;--seg:#FFFFFF;--segEdge:transparent;--grab:#C4C4CA}
.r.dark{--bg:#000000;--surface:#151517;--edge:transparent;--ink:#F2F2F7;--ink2:#A1A1AA;--line:#2C2C2E;--accent:#5AD4E6;--btnBg:#5AD4E6;--btnInk:#00262B;--btnEdge:transparent;--fill:rgba(118,118,128,.3);--fillEdge:transparent;--seg:#636366;--segEdge:transparent;--grab:#48484A}
.r.night{--bg:#000000;--surface:#000000;--edge:#3A2410;--ink:#D08A3C;--ink2:#A56A2E;--line:#24160A;--accent:#D9602B;--btnBg:transparent;--btnInk:#D9602B;--btnEdge:#8A3F1C;--fill:transparent;--fillEdge:#3A2410;--seg:transparent;--segEdge:#8A3F1C;--grab:#3A2410}
.disp{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;letter-spacing:-.02em}
button{font:inherit;color:inherit}
.grp{background:var(--surface);border:1px solid var(--edge);border-radius:26px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row b{font-size:16px;font-weight:600;display:block}
.row small{font-size:13px;color:var(--ink2);display:block}
.seg{display:grid;background:var(--fill);border:1px solid var(--fillEdge);border-radius:22px;padding:3px;height:44px;box-sizing:border-box}
.seg button{border:1.5px solid transparent;background:transparent;border-radius:19px;font-size:14px;font-weight:500;padding:0}
.seg button.on{background:var(--seg);border-color:var(--segEdge);font-weight:700}
.sw{width:51px;height:31px;border-radius:16px;box-sizing:border-box;padding:2px;display:flex;flex-shrink:0;border:1.5px solid var(--fillEdge);background:var(--fill)}
.sw i{width:24px;height:24px;border-radius:12px;background:var(--ink2)}
.sw.on{background:var(--btnBg);border-color:var(--btnEdge);justify-content:flex-end}
.sw.on i{background:var(--btnInk)}
.sl{position:relative;height:28px;flex-grow:1}
.sl::before{content:"";position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--line)}
.sl u{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:var(--accent)}
.sl i{position:absolute;top:1px;width:26px;height:26px;margin-left:-13px;border-radius:13px;box-sizing:border-box;background:var(--bg);border:2px solid var(--accent)}
h2{margin:20px 4px 8px;font-size:15px;font-weight:600;color:var(--ink2)}
</style>
</helmet>
<div class="r {{mode}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); padding: 54px 16px 0">
  <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: var(--grab); margin: 0 auto 10px"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <h1 class="disp" style="margin: 0; font-size: 28px; line-height: 34px">Display</h1>
    <button style="height: 44px; border: 0; background: transparent; padding: 0 4px; font-size: 16px; font-weight: 700; color: var(--accent)">Done</button>
  </div>

  <div style="margin-top: 10px; background: var(--surface); border: 1px solid var(--edge); border-radius: 18px; height: 64px; display: flex; align-items: center; justify-content: center; gap: 26px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-variant-numeric: tabular-nums" role="img" aria-label="Preview: given digits 2 and 9, entered digits 6 and 8">
    <span style="font-weight: 800">2</span><span style="font-weight: 500; color: var(--accent)">6</span><span style="font-weight: 800">9</span><span style="font-weight: 500; color: var(--accent)">8</span>
  </div>

  <h2>Appearance</h2>
  <div class="seg" role="group" aria-label="Appearance" style="grid-template-columns: repeat(3, minmax(0, 1fr))">
    <button class="{{segLight}}">Light</button><button class="{{segDark}}">Dark</button><button class="{{segNight}}">Night</button>
  </div>
  <div class="grp" style="margin-top: 10px">
    <div class="row"><div style="flex-grow: 1"><b>Night after dark</b><small>Switches at sunset, back at sunrise</small></div><span class="sw on" role="switch" aria-checked="true" aria-label="Night after dark"><i></i></span></div>
  </div>

  <h2>Night</h2>
  <div class="seg" role="group" aria-label="Night preset" style="grid-template-columns: repeat(3, minmax(0, 1fr))">
    <button class="on">Reading lamp</button><button>Lights out</button><button>Red light</button>
  </div>
  <div class="grp" style="margin-top: 10px">
    <div class="row"><b style="width: 68px">Glow</b><span class="sl" role="slider" aria-label="Glow" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100"><u style="width: 45%"></u><i style="left: 45%"></i></span><small style="width: 52px; text-align: right; font-variant-numeric: tabular-nums">45%</small></div>
    <div class="row"><b style="width: 68px">Warmth</b><span class="sl" role="slider" aria-label="Warmth" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><u style="width: 60%"></u><i style="left: 60%"></i></span><small style="width: 52px; text-align: right; font-variant-numeric: tabular-nums">1800 K</small></div>
    <div class="row" style="padding-top: 8px; padding-bottom: 8px"><b style="width: 68px">Clarity</b><div class="seg" role="group" aria-label="Clarity" style="flex-grow: 1; height: 38px; grid-template-columns: repeat(3, minmax(0, 1fr))"><button class="on">Standard</button><button>Large</button><button>Bold</button></div></div>
    <div class="row"><div style="flex-grow: 1"><b>Drift</b><small>Dims and warms slowly over 30 minutes</small></div><span class="sw on" role="switch" aria-checked="true" aria-label="Drift"><i></i></span></div>
  </div>

  <button style="margin-top: 14px; width: 100%; height: 48px; border: 1px solid var(--fillEdge); border-radius: 24px; background: var(--fill); color: var(--accent); font-size: 15px; font-weight: 700">Find my lowest glow</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark","night"],"default":"night"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const mode = this.props.mode ?? 'night';
return { mode: mode, segLight: mode === 'light' ? 'on' : '', segDark: mode === 'dark' ? 'on' : '', segNight: mode === 'night' ? 'on' : '' };
}
}
</script>
</body>
</html>
