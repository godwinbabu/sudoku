<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>v3 — Solved</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.r{font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.r.light{--bg:#F2F2F7;--surface:#FFFFFF;--edge:transparent;--ink:#000000;--ink2:#63636A;--line:#D4D4DA;--lineM:#3A3A3C;--accent:#007580;--btnBg:#007580;--btnInk:#FFFFFF;--btnEdge:transparent;--fill:rgba(118,118,128,.14);--fillEdge:transparent}
.r.dark{--bg:#000000;--surface:#151517;--edge:transparent;--ink:#F2F2F7;--ink2:#A1A1AA;--line:#2C2C2E;--lineM:#7C7C82;--accent:#5AD4E6;--btnBg:#5AD4E6;--btnInk:#00262B;--btnEdge:transparent;--fill:rgba(118,118,128,.3);--fillEdge:transparent}
.r.night{--bg:#000000;--surface:#000000;--edge:#3A2410;--ink:#D08A3C;--ink2:#A56A2E;--line:#24160A;--lineM:#80522A;--accent:#D9602B;--btnBg:transparent;--btnInk:#D9602B;--btnEdge:#8A3F1C;--fill:transparent;--fillEdge:#3A2410}
.disp{font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-weight:800;letter-spacing:-.02em}
button{font:inherit;color:inherit}
.c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque","DM Sans",sans-serif;font-size:26px;font-variant-numeric:tabular-nums;border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-sizing:border-box}
.c:nth-child(9n){border-right:0}.c:nth-child(n+73){border-bottom:0}
.c.br{border-right:2px solid var(--lineM)}.c.bb{border-bottom:2px solid var(--lineM)}
.c.g{font-weight:800;color:var(--ink)}.c.u{font-weight:500;color:var(--accent)}
.chip{height:32px;padding:0 12px;border-radius:16px;background:var(--fill);border:1px solid var(--fillEdge);font-size:14px;font-weight:600;display:flex;align-items:center}
</style>
</helmet>
<div class="r {{mode}}" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: var(--bg); color: var(--ink); padding: 106px 16px 0">
  <div aria-hidden="true" style="margin: 0 -12px; opacity: .3; background: var(--surface); border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr))">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="81"><div class="{{c.k}}">{{c.d}}</div></sc-for>
  </div>

  <h1 class="disp" style="margin: 22px 0 0; font-size: 52px; line-height: 54px; letter-spacing: -.03em">Solved</h1>
  <p style="margin: 2px 0 0; font-size: 17px; color: var(--ink2); font-variant-numeric: tabular-nums">Medium · 18:24</p>

  <p style="margin: 18px 0 8px; font-size: 13px; font-weight: 500; color: var(--ink2)">This grid needed</p>
  <div style="display: flex; flex-wrap: wrap; gap: 6px">
    <span class="chip">Naked Single</span><span class="chip">Hidden Single</span><span class="chip">Pointing</span>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; gap: 8px">
    <button style="flex: 1; height: 50px; border: 1px solid var(--fillEdge); border-radius: 25px; background: var(--fill); color: var(--accent); font-size: 16px; font-weight: 700">Another</button>
    <button style="flex: 1; height: 50px; border: 1.5px solid var(--btnEdge); border-radius: 25px; background: var(--btnBg); color: var(--btnInk); font-size: 16px; font-weight: 700">Goodnight</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark","night"],"default":"night"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const G = '23........7..9..48...34.2....9..145........91..395.8..9..2...8.5.....6.2.42..6.79';
const S = '534678912672195348198342567859761423426853791713924856961537284287419635345286179'.replace(/[25]/g, function (c) { return c === '2' ? '5' : '2'; });
const cells = [];
for (let i = 0; i < 81; i++) {
const r = Math.floor(i / 9), c = i % 9;
let k = G[i] !== '.' ? 'c g' : 'c u';
if (c % 3 === 2 && c < 8) k += ' br';
if (r % 3 === 2 && r < 8) k += ' bb';
cells.push({ d: S[i], k: k });
}
return { mode: this.props.mode ?? 'night', cells: cells };
}
}
</script>
</body>
</html>
