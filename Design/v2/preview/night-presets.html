<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.serif{font-family:var(--font-display);font-weight:500;letter-spacing:-.01em}</style></head>
<body style="background:#000;padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div class="ps-night-lamp" style="border-radius:16px;box-shadow:inset 0 0 0 1px var(--hair);padding:18px;display:flex;flex-direction:column;gap:10px">
<span class="serif" style="font-size:24px;color:var(--ink)">Reading lamp</span><span style="font-size:13px;color:var(--ink3)">glow 55 · warmth 45 · 2200 K</span>
<div style="display:flex;gap:16px;align-items:baseline;margin-top:6px"><span style="font-size:36px;font-weight:600;color:var(--ink)">3</span><span style="font-size:36px;color:var(--accent)">8</span><span style="font-size:36px;color:var(--err);position:relative">4<span style="position:absolute;left:-2px;right:-2px;bottom:-4px;height:2px;background:var(--err)"></span></span></div>
<div style="display:flex;gap:6px;margin-top:4px"><span style="height:30px;padding:0 14px;border-radius:15px;box-shadow:inset 0 0 0 1.5px var(--accentDim);color:var(--accent);font-size:13px;font-weight:600;display:flex;align-items:center">Place 6</span><span style="height:30px;padding:0 14px;border-radius:15px;box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink2);font-size:13px;display:flex;align-items:center">Another</span></div></div><div class="ps-night-out" style="border-radius:16px;box-shadow:inset 0 0 0 1px var(--hair);padding:18px;display:flex;flex-direction:column;gap:10px">
<span class="serif" style="font-size:24px;color:var(--ink)">Lights out</span><span style="font-size:13px;color:var(--ink3)">glow 18 · warmth 75 · 1500 K</span>
<div style="display:flex;gap:16px;align-items:baseline;margin-top:6px"><span style="font-size:36px;font-weight:600;color:var(--ink)">3</span><span style="font-size:36px;color:var(--accent)">8</span><span style="font-size:36px;color:var(--err);position:relative">4<span style="position:absolute;left:-2px;right:-2px;bottom:-4px;height:2px;background:var(--err)"></span></span></div>
<div style="display:flex;gap:6px;margin-top:4px"><span style="height:30px;padding:0 14px;border-radius:15px;box-shadow:inset 0 0 0 1.5px var(--accentDim);color:var(--accent);font-size:13px;font-weight:600;display:flex;align-items:center">Place 6</span><span style="height:30px;padding:0 14px;border-radius:15px;box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink2);font-size:13px;display:flex;align-items:center">Another</span></div></div><div class="ps-night-red" style="border-radius:16px;box-shadow:inset 0 0 0 1px var(--hair);padding:18px;display:flex;flex-direction:column;gap:10px">
<span class="serif" style="font-size:24px;color:var(--ink)">Red light</span><span style="font-size:13px;color:var(--ink3)">glow 10 · warmth 100 · 1200 K</span>
<div style="display:flex;gap:16px;align-items:baseline;margin-top:6px"><span style="font-size:36px;font-weight:600;color:var(--ink)">3</span><span style="font-size:36px;color:var(--accent)">8</span><span style="font-size:36px;color:var(--err);position:relative">4<span style="position:absolute;left:-2px;right:-2px;bottom:-4px;height:2px;background:var(--err)"></span></span></div>
<div style="display:flex;gap:6px;margin-top:4px"><span style="height:30px;padding:0 14px;border-radius:15px;box-shadow:inset 0 0 0 1.5px var(--accentDim);color:var(--accent);font-size:13px;font-weight:600;display:flex;align-items:center">Place 6</span><span style="height:30px;padding:0 14px;border-radius:15px;box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink2);font-size:13px;display:flex;align-items:center">Another</span></div></div>
</body></html>
