<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.serif{font-family:var(--font-display);font-weight:500;letter-spacing:-.01em}</style></head>
<body style="background:var(--bg);padding:20px;display:grid;grid-template-columns:repeat(8,1fr);gap:10px">
<div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--hair)"></div><span style="font-size:12px;font-weight:600;color:var(--ink)">bg</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--hair)"></div><span style="font-size:12px;font-weight:600;color:var(--ink)">surface</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border-radius:12px;background:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)"></div><span style="font-size:12px;font-weight:600;color:var(--ink)">ink</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border-radius:12px;background:var(--ink2);box-shadow:inset 0 0 0 1px var(--hair)"></div><span style="font-size:12px;font-weight:600;color:var(--ink)">ink2</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border-radius:12px;background:var(--ink3);box-shadow:inset 0 0 0 1px var(--hair)"></div><span style="font-size:12px;font-weight:600;color:var(--ink)">ink3</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border-radius:12px;background:var(--accent);box-shadow:inset 0 0 0 1px var(--hair)"></div><span style="font-size:12px;font-weight:600;color:var(--ink)">accent</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border-radius:12px;background:var(--sel);box-shadow:inset 0 0 0 1px var(--hair)"></div><span style="font-size:12px;font-weight:600;color:var(--ink)">sel</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:84px;border-radius:12px;background:var(--err);box-shadow:inset 0 0 0 1px var(--hair)"></div><span style="font-size:12px;font-weight:600;color:var(--ink)">err</span></div>
</body></html>
