<!-- @dsCard group="Night" viewport="760x430" name="Glow × Warmth" subtitle="Night palette is computed from two continuous axes" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.serif{font-family:var(--font-display);font-weight:500;letter-spacing:-.01em}</style><script src="../ui_kits/puresudoku-2/night.js"></script></head>
<body style="background:#000;padding:22px 24px;color:#bbb"><div id="m" style="display:grid;grid-template-columns:70px repeat(4,1fr);gap:8px"></div>
<script>
const W=[0,35,70,100],G=[90,55,25,5],m=document.getElementById('m');let h='<div></div>';
W.forEach(w=>{const p=PSNight.palette({appearance:'night',glow:90,warmth:w,clarity:0});h+='<div class="lbl" style="color:#777;padding-bottom:4px">Warmth '+w+' · '+p.kelvin+' K</div>'});
G.forEach(g=>{h+='<div class="lbl" style="color:#777;align-self:center">Glow '+g+'</div>';W.forEach(w=>{const v=PSNight.palette({appearance:'night',glow:g,warmth:w,clarity:0}).vars;h+='<div style="height:80px;border-radius:10px;box-shadow:inset 0 0 0 1px '+v['--hair']+';display:flex;align-items:center;justify-content:center;gap:12px"><span style="font-size:34px;font-weight:600;color:'+v['--ink']+'">5</span><span style="font-size:34px;font-weight:400;color:'+v['--accent']+'">7</span><span style="font-size:13px;color:'+v['--ink3']+'">notes</span></div>'})});
m.innerHTML=h;
</script></body></html>
