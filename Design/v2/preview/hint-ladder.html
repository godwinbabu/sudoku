<!-- @dsCard group="Components" viewport="760x250" name="Hint ladder" subtitle="Where → Which → Why → Place" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.serif{font-family:var(--font-display);font-weight:500;letter-spacing:-.01em}</style></head>
<body style="background:var(--bg);padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
<div style="background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:170px;box-sizing:border-box">
<div style="display:flex;gap:8px;align-items:center"><span style="display:flex;gap:4px"><span style="width:14px;height:5px;border-radius:3px;background:var(--accent)"></span><span style="width:5px;height:5px;border-radius:3px;background:var(--hair)"></span><span style="width:5px;height:5px;border-radius:3px;background:var(--hair)"></span></span><span class="lbl" style="color:var(--ink3)">Where to look</span></div>
<span style="font-size:16px;line-height:1.35;color:var(--ink);flex:1">Look at box 4. Where can 5 go?</span>
<span style="align-self:flex-end;height:32px;padding:0 14px;border-radius:16px;background:var(--accent);color:var(--bg);font-size:14px;font-weight:600;display:flex;align-items:center">Which technique?</span></div><div style="background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:170px;box-sizing:border-box">
<div style="display:flex;gap:8px;align-items:center"><span style="display:flex;gap:4px"><span style="width:5px;height:5px;border-radius:3px;background:var(--accent)"></span><span style="width:14px;height:5px;border-radius:3px;background:var(--accent)"></span><span style="width:5px;height:5px;border-radius:3px;background:var(--hair)"></span></span><span class="lbl" style="color:var(--ink3)">Technique</span></div>
<span class="serif" style="font-size:21px;color:var(--ink)">Hidden Single</span><span style="font-size:14px;line-height:1.35;color:var(--ink2);flex:1">A digit with only one possible home in a row, column or box.</span>
<span style="align-self:flex-end;height:32px;padding:0 14px;border-radius:16px;background:var(--accent);color:var(--bg);font-size:14px;font-weight:600;display:flex;align-items:center">Show me why</span></div><div style="background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:170px;box-sizing:border-box">
<div style="display:flex;gap:8px;align-items:center"><span style="display:flex;gap:4px"><span style="width:5px;height:5px;border-radius:3px;background:var(--accent)"></span><span style="width:5px;height:5px;border-radius:3px;background:var(--accent)"></span><span style="width:14px;height:5px;border-radius:3px;background:var(--accent)"></span></span><span class="lbl" style="color:var(--ink3)">Why</span></div>
<span style="font-size:14px;line-height:1.35;color:var(--ink2);flex:1">Every other empty cell in box 4 already sees a 5. So 5 can only go in row 5, column 2.</span>
<span style="align-self:flex-end;height:32px;padding:0 14px;border-radius:16px;background:var(--accent);color:var(--bg);font-size:14px;font-weight:600;display:flex;align-items:center">Place 5</span></div>
</body></html>
